<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460">
  <defs>
    <!-- POS Terminal Gradients -->
    <linearGradient id="terminalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#463E56" />
      <stop offset="60%" stop-color="#322B3F" />
      <stop offset="100%" stop-color="#241E2D" />
    </linearGradient>
    <linearGradient id="terminalSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282233" />
      <stop offset="100%" stop-color="#18141F" />
    </linearGradient>
    <linearGradient id="posScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243632" />
      <stop offset="100%" stop-color="#14211E" />
    </linearGradient>
    
    <!-- Bank Card Vibrant Purple/Blue Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5544B3" />
      <stop offset="45%" stop-color="#6F58D6" />
      <stop offset="85%" stop-color="#7B8EF7" />
      <stop offset="100%" stop-color="#8BA5FF" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4DCF7" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2F85" />
      <stop offset="50%" stop-color="#7C4DBF" />
      <stop offset="100%" stop-color="#532B8C" />
    </linearGradient>
    <radialGradient id="posShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(46, 35, 82, 0.45)" />
      <stop offset="70%" stop-color="rgba(46, 35, 82, 0.15)" />
      <stop offset="100%" stop-color="rgba(46, 35, 82, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="270" cy="385" rx="200" ry="32" fill="url(#posShadow)" />

  <!-- ==========================================
       ISOMETRIC POS TERMINAL BASE
       ========================================== -->
  <g transform="translate(40, 20)">
    <!-- Terminal Main Body Base -->
    <!-- Bottom Side Walls -->
    <path d="M120 280 L290 380 L440 260 L440 220 L290 340 L120 240 Z" fill="url(#terminalSide)" />
    
    <!-- Left Beveled Wall -->
    <path d="M60 210 L120 240 L120 280 L60 250 Z" fill="#1C1724" />
    <path d="M60 210 L230 110 L290 140 L120 240 Z" fill="#3A3247" />

    <!-- Top Slanted Surface -->
    <path d="M120 240 L290 340 L440 220 L270 120 Z" fill="url(#terminalTop)" stroke="#524864" stroke-width="1.5" />

    <!-- Top Paper Roll Housing (Rounded back top) -->
    <path d="M230 110 Q280 80 340 100 L440 180 Q450 200 440 220 L270 120 Z" fill="#2E2738" stroke="#483E58" stroke-width="1" />

    <!-- Terminal Screen Display (Angled) -->
    <polygon points="255,145 375,215 345,260 225,190" fill="url(#posScreenGrad)" stroke="#384E48" stroke-width="2" rx="4" />
    <!-- Screen Content / UI Elements -->
    <rect x="250" y="160" width="40" height="6" rx="3" fill="#4ADE80" opacity="0.6" transform="rotate(30 250 160)" />
    <rect x="270" y="172" width="60" height="5" rx="2.5" fill="#A7F3D0" opacity="0.4" transform="rotate(30 270 172)" />
    <rect x="290" y="184" width="35" height="5" rx="2.5" fill="#A7F3D0" opacity="0.4" transform="rotate(30 290 184)" />
    <!-- Battery Status Icon on Screen -->
    <rect x="345" y="210" width="16" height="8" rx="2" fill="#4ADE80" opacity="0.75" transform="rotate(30 345 210)" />

    <!-- Keypad Button Matrix (Isometric Rows) -->
    <!-- Row 1 -->
    <polygon points="175,230 195,242 190,250 170,238" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="205,248 225,260 220,268 200,256" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="235,266 255,278 250,286 230,274" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <!-- Row 2 -->
    <polygon points="190,252 210,264 205,272 185,260" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="220,270 240,282 235,290 215,278" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="250,288 270,300 265,308 245,296" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <!-- Row 3 -->
    <polygon points="205,274 225,286 220,294 200,282" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="235,292 255,304 250,312 230,300" fill="#58487A" stroke="#7C63A8" stroke-width="1" />
    <polygon points="265,310 285,322 280,330 260,318" fill="#58487A" stroke="#7C63A8" stroke-width="1" />

    <!-- Card Reader Slot Side Channel -->
    <path d="M290 340 L440 220 L444 224 L294 344 Z" fill="#15111B" />
    <!-- Card Slot Illuminated Lip -->
    <path d="M292 336 L438 218" stroke="#B4317F" stroke-width="3" stroke-linecap="round" />
    <path d="M292 336 L438 218" stroke="#9B5DE5" stroke-width="6" opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       ISOMETRIC BANK CARD SWIPING IN SLOT
       ========================================== -->
  <g transform="translate(100, 160)">
    <!-- Bank Card Polygon (Sleek Isometric Orientation) -->
    <polygon points="60,60 210,0 210,135 60,195" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" />
    
    <!-- Specular Diagonal Sheen -->
    <polygon points="75,60 140,35 120,170 55,195" fill="#FFFFFF" opacity="0.18" />

    <!-- EMV Smart Chip -->
    <polygon points="85,90 115,78 115,115 85,127" fill="url(#chipGrad)" stroke="#B3C0EA" stroke-width="1" />
    <line x1="100" y1="84" x2="100" y2="121" stroke="#8A9DD8" stroke-width="1" />
    <line x1="85" y1="108" x2="115" y2="96" stroke="#8A9DD8" stroke-width="1" />

    <!-- Embossed Card Dashes (Card Number Placeholder) -->
    <polygon points="125,120 140,114 140,122 125,128" fill="#FFFFFF" opacity="0.6" />
    <polygon points="145,112 160,106 160,114 145,120" fill="#FFFFFF" opacity="0.6" />
    <polygon points="165,104 180,98 180,106 165,112" fill="#FFFFFF" opacity="0.6" />
    <polygon points="185,96 200,90 200,98 185,104" fill="#FFFFFF" opacity="0.6" />

    <!-- Card Brand Emblem in Corner -->
    <circle cx="185" cy="40" r="12" fill="#FFC83B" opacity="0.6" />
    <circle cx="170" cy="46" r="12" fill="#F87171" opacity="0.6" />
  </g>

  <!-- ==========================================
       CURVED PURPLE MOTION ARROW
       ========================================== -->
  <path d="M240 370 C340 375, 410 330, 420 280" 
        stroke="url(#arrowGrad)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.95" />
  <!-- Arrow Head -->
  <polygon points="415,265 435,285 410,295" fill="#7C4DBF" />
</svg>
