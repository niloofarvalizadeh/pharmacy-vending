<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <!-- Bottle Shading -->
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E4F2" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2EFF9" />
      <stop offset="100%" stop-color="#D5CDE6" />
    </linearGradient>
    <linearGradient id="tealCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B6D85" />
      <stop offset="40%" stop-color="#2DA8C4" />
      <stop offset="80%" stop-color="#248FA8" />
      <stop offset="100%" stop-color="#175669" />
    </linearGradient>
    <radialGradient id="shadowUnderM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(84, 60, 140, 0.28)" />
      <stop offset="100%" stop-color="rgba(84, 60, 140, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="120" cy="275" rx="65" ry="12" fill="url(#shadowUnderM)" />

  <!-- Bottle Neck -->
  <rect x="94" y="60" width="52" height="20" rx="4" fill="#E8E4F2" stroke="#CCC4E0" stroke-width="1" />

  <!-- Bottle Body -->
  <rect x="68" y="76" width="104" height="190" rx="24" fill="url(#bottleBody)" stroke="#E3DEEE" stroke-width="1.5" />

  <!-- Teal/Cyan Medical Label Band -->
  <rect x="68" y="112" width="104" height="108" fill="#FFFFFF" />
  <rect x="68" y="116" width="104" height="34" fill="#2DA8C4" opacity="0.9" />
  <circle cx="120" cy="133" r="12" fill="#FFFFFF" />
  <!-- Medical Plus in Label -->
  <path d="M117 127h6v12h-6z M114 130h12v6h-12z" fill="#2DA8C4" />
  
  <text x="120" y="172" font-family="sans-serif" font-size="11" font-weight="900" fill="#532B8C" text-anchor="middle">MULTIVITAMIN</text>
  <text x="120" y="186" font-family="sans-serif" font-size="8" font-weight="700" fill="#2DA8C4" text-anchor="middle">A-Z COMPLETE</text>
  
  <rect x="85" y="196" width="70" height="14" rx="7" fill="#E7E3F6" />
  <text x="120" y="206" font-family="sans-serif" font-size="7" font-weight="700" fill="#532B8C" text-anchor="middle">60 TABLETS</text>

  <!-- Subtle Specular Highlight Stripe -->
  <path d="M78 88 Q78 240 82 255" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Teal Ribbed Bottle Cap -->
  <rect x="82" y="36" width="76" height="28" rx="6" fill="url(#tealCap)" />
  <line x1="90" y1="38" x2="90" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="98" y1="38" x2="98" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="106" y1="38" x2="106" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="114" y1="38" x2="114" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="122" y1="38" x2="122" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="130" y1="38" x2="130" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="138" y1="38" x2="138" y2="60" stroke="#48C3E0" stroke-width="1.5" />
  <line x1="146" y1="38" x2="146" y2="60" stroke="#48C3E0" stroke-width="1.5" />
</svg>
