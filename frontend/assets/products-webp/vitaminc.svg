<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <!-- Tube Shading Gradients -->
    <linearGradient id="tubeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E16" />
      <stop offset="20%" stop-color="#E87A24" />
      <stop offset="50%" stop-color="#FFA845" />
      <stop offset="80%" stop-color="#E87A24" />
      <stop offset="100%" stop-color="#A84C0B" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD9ED" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C5BDDE" />
    </linearGradient>
    <radialGradient id="shadowUnder" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(84, 60, 140, 0.28)" />
      <stop offset="100%" stop-color="rgba(84, 60, 140, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="120" cy="275" rx="55" ry="12" fill="url(#shadowUnder)" />

  <!-- Tube Body -->
  <rect x="94" y="55" width="52" height="215" rx="10" fill="url(#tubeBody)" />

  <!-- Inner Tube Fluid Highlight -->
  <rect x="97" y="60" width="10" height="205" rx="5" fill="#FFE8C2" opacity="0.4" />

  <!-- Vitamin C Label -->
  <rect x="94" y="100" width="52" height="110" fill="#FFFFFF" opacity="0.92" />
  <rect x="97" y="105" width="46" height="4" rx="2" fill="#E87A24" />
  <circle cx="120" cy="140" r="16" fill="#FFA845" opacity="0.3" />
  <circle cx="120" cy="140" r="12" fill="#E87A24" />
  <path d="M116 134h8v3h-5v3h4v3h-4v5h-3z" fill="#FFFFFF" />
  <text x="120" y="172" font-family="sans-serif" font-size="10" font-weight="900" fill="#532B8C" text-anchor="middle">VIT-C</text>
  <text x="120" y="184" font-family="sans-serif" font-size="7" font-weight="700" fill="#A396C6" text-anchor="middle">1000mg</text>
  <rect x="97" y="200" width="46" height="4" rx="2" fill="#532B8C" />

  <!-- Effervescent Bubbles Inside Tube -->
  <circle cx="106" cy="80" r="2.5" fill="#FFFFFF" opacity="0.7" />
  <circle cx="114" cy="72" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="132" cy="84" r="2" fill="#FFFFFF" opacity="0.6" />
  <circle cx="108" cy="235" r="3" fill="#FFFFFF" opacity="0.7" />
  <circle cx="128" cy="245" r="2.5" fill="#FFFFFF" opacity="0.7" />
  <circle cx="120" cy="255" r="3.5" fill="#FFFFFF" opacity="0.8" />

  <!-- Ribbed White Cap -->
  <rect x="90" y="38" width="60" height="20" rx="4" fill="url(#capGrad)" stroke="#B7AECF" stroke-width="1" />
  <line x1="96" y1="40" x2="96" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="104" y1="40" x2="104" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="112" y1="40" x2="112" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="120" y1="40" x2="120" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="128" y1="40" x2="128" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="136" y1="40" x2="136" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
  <line x1="144" y1="40" x2="144" y2="56" stroke="#C5BDDE" stroke-width="1.5" />
</svg>
