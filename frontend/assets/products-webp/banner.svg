<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 380" width="984" height="380">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DCF4" />
      <stop offset="50%" stop-color="#ECE7F8" />
      <stop offset="100%" stop-color="#DFD7F2" />
    </linearGradient>
    <linearGradient id="stethTube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#532B8C" />
      <stop offset="100%" stop-color="#7C4DBF" />
    </linearGradient>
    <linearGradient id="silverBlister" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EEF8" />
      <stop offset="50%" stop-color="#D7D0E8" />
      <stop offset="100%" stop-color="#C5BDDC" />
    </linearGradient>
    <linearGradient id="amberBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#703B0D" />
      <stop offset="40%" stop-color="#A85C1E" />
      <stop offset="100%" stop-color="#542B08" />
    </linearGradient>
  </defs>

  <!-- Banner Rounded Background -->
  <rect width="984" height="380" rx="28" fill="url(#bannerBg)" />

  <!-- Soft Abstract Medical Texture / Decorative Elements on Left Side -->
  <!-- Soft Mint / Green Foliage Leaves on Far Left -->
  <g transform="translate(45, 70)" opacity="0.85">
    <path d="M0 80 Q40 20 90 40 Q70 100 0 80 Z" fill="#4E8C6A" />
    <path d="M30 60 Q80 10 130 50 Q100 110 30 60 Z" fill="#69AB87" />
    <path d="M20 110 Q70 70 120 120 Q60 160 20 110 Z" fill="#3E7557" />
    <path d="M50 140 Q110 110 140 170 Q80 200 50 140 Z" fill="#5AA37B" />
  </g>

  <!-- Stethoscope Coils -->
  <g transform="translate(90, 80)" opacity="0.8">
    <!-- Stethoscope Head / Chestpiece -->
    <circle cx="210" cy="165" r="32" fill="#D3CBE7" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="210" cy="165" r="22" fill="#7C4DBF" />
    <circle cx="210" cy="165" r="10" fill="#FFFFFF" opacity="0.6" />

    <!-- Rubber Tube Curves -->
    <path d="M120 60 C80 180, 160 260, 260 220 C320 190, 310 100, 240 100 C180 100, 160 180, 210 165" 
          stroke="url(#stethTube)" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Metal Binaural Tubes -->
    <path d="M120 60 Q105 20 70 10 M120 60 Q135 20 170 10" 
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="70" cy="10" r="7" fill="#532B8C" />
    <circle cx="170" cy="10" r="7" fill="#532B8C" />
  </g>

  <!-- Blister Pack with White/Cyan Tablets -->
  <g transform="translate(260, 50)" opacity="0.85">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="url(#silverBlister)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="22" cy="22" r="12" fill="#FFFFFF" />
    <circle cx="50" cy="22" r="12" fill="#FFFFFF" />
    <circle cx="78" cy="22" r="12" fill="#FFFFFF" />
    <circle cx="106" cy="22" r="12" fill="#FFFFFF" />
    <circle cx="22" cy="48" r="12" fill="#FFFFFF" />
    <circle cx="50" cy="48" r="12" fill="#FFFFFF" />
    <circle cx="78" cy="48" r="12" fill="#FFFFFF" />
    <circle cx="106" cy="48" r="12" fill="#FFFFFF" />
  </g>

  <!-- Amber Medicine Dropper / Glass Bottle -->
  <g transform="translate(330, 130)" opacity="0.85">
    <rect x="0" y="24" width="62" height="110" rx="14" fill="url(#amberBottle)" />
    <rect x="16" y="8" width="30" height="18" rx="3" fill="#D3CBE7" />
    <rect x="22" y="0" width="18" height="10" rx="4" fill="#2E2352" />
    <!-- Label -->
    <rect x="0" y="48" width="62" height="60" fill="#FFFFFF" opacity="0.85" />
    <line x1="8" y1="62" x2="54" y2="62" stroke="#532B8C" stroke-width="3" />
    <line x1="8" y1="74" x2="40" y2="74" stroke="#A396C6" stroke-width="2" />
    <line x1="8" y1="84" x2="48" y2="84" stroke="#A396C6" stroke-width="2" />
  </g>

  <!-- Scattered Capsules around Flat-lay -->
  <g transform="translate(180, 270)">
    <rect x="0" y="0" width="32" height="14" rx="7" fill="#7C4DBF" transform="rotate(25)" />
    <rect x="45" y="10" width="30" height="13" rx="6.5" fill="#C43D80" transform="rotate(-40)" />
    <rect x="110" y="-15" width="28" height="12" rx="6" fill="#FFA845" transform="rotate(15)" />
  </g>
</svg>
