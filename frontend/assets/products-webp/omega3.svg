<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <!-- Omega Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBE7F5" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D9D2EB" />
    </linearGradient>
    <linearGradient id="goldCapsule" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8" />
      <stop offset="40%" stop-color="#FFC83B" />
      <stop offset="80%" stop-color="#E89617" />
      <stop offset="100%" stop-color="#B56A05" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D55B4" />
      <stop offset="100%" stop-color="#4B77DE" />
    </linearGradient>
    <radialGradient id="shadowUnderO" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(84, 60, 140, 0.28)" />
      <stop offset="100%" stop-color="rgba(84, 60, 140, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="120" cy="272" rx="80" ry="14" fill="url(#shadowUnderO)" />

  <!-- 3D Isometric / Front Product Box -->
  <!-- Box Top Flap -->
  <polygon points="45,95 85,70 195,70 155,95" fill="#EAE6F5" stroke="#C9C2DF" stroke-width="1.2" />
  <!-- Box Right Flap -->
  <polygon points="155,95 195,70 195,215 155,245" fill="#D3CBE7" stroke="#BBB2D6" stroke-width="1.2" />
  <!-- Box Front Face -->
  <polygon points="45,95 155,95 155,245 45,245" fill="url(#boxGrad)" stroke="#CCC5E2" stroke-width="1.2" />

  <!-- Blue Wave Band across Box Front -->
  <path d="M45 150 Q100 135 155 160 L155 200 Q100 175 45 190 Z" fill="url(#blueAccent)" opacity="0.85" />
  <path d="M45 155 Q100 140 155 165 L155 175 Q100 150 45 165 Z" fill="#FFC83B" opacity="0.9" />

  <!-- Typography on Box -->
  <text x="55" y="125" font-family="sans-serif" font-size="16" font-weight="900" fill="#2E2352">Omega-3</text>
  <text x="55" y="140" font-family="sans-serif" font-size="9" font-weight="700" fill="#7C4DBF">1000 mg EPA/DHA</text>
  
  <text x="55" y="225" font-family="sans-serif" font-size="8" font-weight="800" fill="#532B8C">PURE FISH OIL</text>
  <text x="55" y="236" font-family="sans-serif" font-size="7" font-weight="600" fill="#A396C6">HEART &amp; BRAIN</text>

  <!-- Big Amber Softgel Capsule Floating in Front -->
  <g transform="translate(130, 185) rotate(-35)">
    <!-- Capsule Glow/Shadow -->
    <ellipse cx="0" cy="0" rx="34" ry="18" fill="url(#goldCapsule)" stroke="#D4860D" stroke-width="1.5" />
    <!-- Specular Highlight Curve -->
    <path d="M-22 -8 Q0 -16 22 -6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    <circle cx="16" cy="4" r="3" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>
